name: pytest-sharded
on:
  pull_request:
    branches-ignore: [ 'agent-test/**' ]
permissions:
  contents: read
jobs:
  conformance:
    uses: NeutralAIz/keel/.github/workflows/pytest-sharded.yml@ef0f4fb4b0caebb3a299502bdb43aeb15162b23c
    with:
      paths: conformance
      shard_count: 1
      timeout_minutes: 5
      python-version: "3.10"
      install_command: python -m pip install pytest jsonschema cryptography
