name: pytest-sharded
on:
  pull_request:
    branches-ignore: [ 'agent-test/**' ]
permissions:
  contents: read
jobs:
  conformance:
    uses: NeutralAIz/keel/.github/workflows/pytest-sharded.yml@3155bce9e0b81932f13ea4db1a781f5771d3620b
    with:
      paths: conformance
      shard_count: 1
      timeout_minutes: 5
      python-version: "3.10"
      install_command: python -m pip install pytest jsonschema cryptography
