name: NACP Conformance

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: any
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: NeutralAIz/ci-shared/actions/python@f7088b169cb9cc68f805d4131b8124f99af14aad
      with:
        python-version: '3.10'
        requirements: |
          pytest
          jsonschema
          ed25519
    - uses: NeutralAIz/ci-shared/actions/testkit@f7088b169cb9cc68f805d4131b8124f99af14aad
    - name: Run conformance tests
      run: |
        pytest -p neutralaiz_testkit --testkit-mode=report conformance/
