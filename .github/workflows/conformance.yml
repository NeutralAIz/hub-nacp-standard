name: NACP Conformance

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: any
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: NeutralAIz/keel/actions/python@e6bda8001bfc441df4a078365a77375524a1ab4d
      with:
        python-version: '3.10'
        requirements: |
          pytest
          jsonschema
          ed25519
    - uses: NeutralAIz/keel/actions/testkit@e6bda8001bfc441df4a078365a77375524a1ab4d
    - name: Run conformance tests
      run: |
        pytest -p neutralaiz_testkit --testkit-mode=report conformance/
