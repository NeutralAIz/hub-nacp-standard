name: NACP Conformance

on:
  push:
    branches-ignore: [ 'agent-test/**' ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    # Preserve main-only push execution while excluding scratch refs at the trigger.
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: any
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: NeutralAIz/keel/actions/python@ef0f4fb4b0caebb3a299502bdb43aeb15162b23c
      with:
        python-version: '3.10'
        requirements: |
          pytest
          jsonschema
          cryptography
    - uses: NeutralAIz/keel/actions/testkit@ef0f4fb4b0caebb3a299502bdb43aeb15162b23c
    - name: Run conformance tests
      run: |
        pytest -p neutralaiz_testkit --testkit-mode=report conformance/
