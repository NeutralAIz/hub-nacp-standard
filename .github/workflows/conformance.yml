name: NACP Conformance

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: any
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: NeutralAIz/ci-shared/actions/python@24520b25bea49ae1f0388b980db7a5b7e9568d7e
      with:
        python-version: '3.10'
        requirements: |
          pytest
          jsonschema
          ed25519
    - uses: NeutralAIz/ci-shared/actions/testkit@24520b25bea49ae1f0388b980db7a5b7e9568d7e
    - name: Run conformance tests
      run: |
        pytest -p neutralaiz_testkit --testkit-mode=report conformance/
