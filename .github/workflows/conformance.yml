# Inlined (Q-2923 / Q-3024, hub-nacp-standard#7): hub-nacp-standard is a PUBLIC repo and cannot call private keel actions.
# Andrew, R1107-012: "Keep it public: copy the checks into it". NO step below calls any NeutralAIz/keel workflow or action.
# Replaces keel actions/python (setup-python pin; same pip install) and actions/testkit + `-p keel_testkit --testkit-mode=report`
# (keel @17a7eec9933a5bdf6e86198e3b87bebfea175280, actions/testkit/action.yml and test/python/keel_testkit/plugin_parts/*).
# The testkit plugin is NOT copied: it is 3.3k lines and its --testkit-mode=report only RECORDS guard violations; see NOTES.md
# for the exact behaviour differences. Test files and assertions are untouched.
name: NACP Conformance

on:
  push:
    branches-ignore: [ 'agent-test/**' ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    # Preserve main-only push execution while excluding scratch refs at the trigger.
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    # PUBLIC repo: no runner group allows public repos; GitHub-hosted ubuntu-latest, CIS035 warning accepted (Prime 33029796, 3d3badc7; R1107-012).
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: '3.10'
    - name: Install test dependencies
      run: python -m pip install pytest jsonschema cryptography
    - name: Run conformance tests
      run: |
        python -m pytest conformance/ --junitxml="$RUNNER_TEMP/conformance-junit.xml"
    - name: Upload JUnit report
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: conformance-junit
        path: ${{ runner.temp }}/conformance-junit.xml
        if-no-files-found: warn
